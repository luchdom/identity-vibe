services:
  authserver:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development  # Changed to Development for debug
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=AuthServer;Username=postgres;Password=postgres
      # Debug/Logging configuration
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Information
      - Logging__LogLevel__Microsoft.Hosting.Lifetime=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      # Enable detailed exception pages
      - ASPNETCORE_DETAILEDERRORS=true
      # URL Configuration
      - EXTERNAL_AUTH_URL=${EXTERNAL_AUTH_URL:-http://localhost:5000}
      - EXTERNAL_CLIENT_URL=${EXTERNAL_CLIENT_URL:-http://localhost:3000}
      - INTERNAL_AUTH_URL=http://authserver:8080
      - INTERNAL_ORDERS_URL=http://orders:8080
      # OpenTelemetry configuration
      - OTEL_SERVICE_NAME=authserver
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_RESOURCE_ATTRIBUTES=service.name=authserver,service.version=1.0.0,deployment.environment=development
