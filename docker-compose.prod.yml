services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=AuthServer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # AuthServer
  authserver:
    build:
      context: .
      dockerfile: src/backend/AuthServer/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=AuthServer;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      # Production URL Configuration (set via .env file)
      - EXTERNAL_AUTH_URL=${EXTERNAL_AUTH_URL}
      - EXTERNAL_CLIENT_URL=${EXTERNAL_CLIENT_URL}
      - INTERNAL_AUTH_URL=http://authserver:80
      - INTERNAL_ORDERS_URL=http://orders:80
    ports:
      - "5000:80"
      - "5001:443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - identity-network
    restart: unless-stopped

  # Orders Service
  orders:
    build:
      context: .
      dockerfile: src/backend/Orders/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      # Production URL Configuration (set via .env file)
      - EXTERNAL_AUTH_URL=${EXTERNAL_AUTH_URL}
      - EXTERNAL_CLIENT_URL=${EXTERNAL_CLIENT_URL}
      - INTERNAL_AUTH_URL=http://authserver:80
      - INTERNAL_ORDERS_URL=http://orders:80
    ports:
      - "5003:80"
      - "5005:443"
    depends_on:
      - authserver
    networks:
      - identity-network
    restart: unless-stopped

  # React Client
  client:
    build:
      context: ./src/web-admin
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_AUTH_URL=${EXTERNAL_AUTH_URL}
      - NEXT_PUBLIC_ORDERS_URL=${EXTERNAL_ORDERS_URL}
      - NEXT_PUBLIC_APP_BASE_URL=${EXTERNAL_CLIENT_URL}
    ports:
      - "3000:3000"
    depends_on:
      - authserver
      - orders
    networks:
      - identity-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  identity-network:
    driver: bridge
